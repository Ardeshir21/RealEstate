# RealEstate local development
# Caddy reverse_proxies to mainframe:9000 on realestate_internal.
# Host port 8080 avoids clashing with TurkeyMode on :80.

services:
  mainframe:
    build:
      context: .
      dockerfile: ./docker/mainframe/Dockerfile
      args:
        APP_NAME: ${APP_NAME:-RealEstate}
    command: bash ./docker/mainframe/dev-start.sh
    restart: no
    networks:
      - realestate_internal
    volumes:
      - .:/app
      - media_volume:/app/media
    env_file:
      - .env
    environment:
      - APP_NAME=${APP_NAME:-RealEstate}
      - DATABASE_HOST=172.31.0.10
      - DATABASE_PORT=5432
    depends_on:
      db:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9000/', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 25s

  caddy:
    build:
      context: .
      dockerfile: ./docker/caddy/dev.Dockerfile
    restart: no
    volumes:
      - media_volume:/app/media
      - ./docker/caddy/Caddyfile.dev:/etc/caddy/Caddyfile:ro
    env_file:
      - .env
    ports:
      - "8080:80"
    networks:
      - realestate_internal
    depends_on:
      mainframe:
        condition: service_healthy

  qcluster:
    build:
      context: .
      dockerfile: ./docker/mainframe/Dockerfile
      args:
        APP_NAME: ${APP_NAME:-RealEstate}
    command: python manage.py qcluster
    restart: no
    networks:
      - realestate_internal
    volumes:
      - .:/app
      - media_volume:/app/media
    env_file:
      - .env
    environment:
      - APP_NAME=${APP_NAME:-RealEstate}
      - DATABASE_HOST=172.31.0.10
      - DATABASE_PORT=5432
    depends_on:
      db:
        condition: service_started
      mainframe:
        condition: service_healthy

  db:
    build:
      context: .
      dockerfile: ./docker/database/Dockerfile
    restart: no
    ports:
      - "5546:5432"
    volumes:
      - db_volume:/var/lib/postgresql/data
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-RealEstate}
      POSTGRES_USER: ${DATABASE_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    networks:
      realestate_internal:
        ipv4_address: 172.31.0.10

networks:
  realestate_internal:
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.0.0/16

volumes:
  db_volume:
  media_volume:
