# RealEstate production app stack.
# Does not bind host 80/443 — shared edge Caddy does (TurkeyMode docker-compose.edge.yml).
# Edge Caddy must reverse_proxy to realestate-mainframe:9000 on edge_net.

services:
  mainframe:
    build:
      context: .
      dockerfile: ./docker/mainframe/Dockerfile
      args:
        APP_NAME: ${APP_NAME:-RealEstate}
    container_name: realestate-mainframe
    restart: always
    networks:
      realestate_internal:
      edge_net:
        aliases:
          - realestate-mainframe
    volumes:
      - static_volume:/app/static
      - media_volume:/app/media
    env_file:
      - .env
    environment:
      - APP_NAME=${APP_NAME:-RealEstate}
      - DATABASE_HOST=172.31.0.10
      - DATABASE_PORT=5432
    depends_on:
      db:
        condition: service_started

  qcluster:
    build:
      context: .
      dockerfile: ./docker/mainframe/Dockerfile
      args:
        APP_NAME: ${APP_NAME:-RealEstate}
    command: python manage.py qcluster
    restart: always
    networks:
      - realestate_internal
    volumes:
      - media_volume:/app/media
    env_file:
      - .env
    environment:
      - APP_NAME=${APP_NAME:-RealEstate}
      - DATABASE_HOST=172.31.0.10
      - DATABASE_PORT=5432
    depends_on:
      db:
        condition: service_started

  db:
    build:
      context: .
      dockerfile: ./docker/database/Dockerfile
    restart: always
    ports:
      - "127.0.0.1:5546:5432"
    volumes:
      - db_volume:/var/lib/postgresql/data
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-RealEstate}
      POSTGRES_USER: ${DATABASE_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    networks:
      realestate_internal:
        ipv4_address: 172.31.0.10

networks:
  realestate_internal:
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.0.0/16
  edge_net:
    name: edge_net
    external: true

volumes:
  db_volume:
  static_volume:
    name: realestate_static
  media_volume:
    name: realestate_media
